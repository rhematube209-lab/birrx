<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta name="theme-color" content="#174836"/>
    <script>try{const t=localStorage.getItem('birrx-theme');if(t!=='light'){document.documentElement.dataset.theme='dark';document.documentElement.style.colorScheme='dark';document.querySelector('meta[name="theme-color"]')?.setAttribute('content','#07100d')}}catch{}</script>
    <meta name="description" content="Privacy-first, offline-ready Ethiopian personal finance and cash flow manager."/>
    
    <!-- iOS / Safari PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <meta name="apple-mobile-web-app-title" content="BirrX"/>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/png" href="/favicon.png"/>
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"/>
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png"/>
    <link rel="manifest" href="/manifest.webmanifest"/>

    <title>BirrX — Ethiopian Personal Finance</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
